<html>
<head>
<base href="." target="_blank">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    overflow: hidden;
    pointer-events: auto;
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0);
    z-index: 0;
}

.url-input-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    gap: 10px;
    background: rgba(0, 0, 0, 0.5);
    padding: 10px;
    border-radius: 5px;
}

#urlInput {
    padding: 8px 15px;
    border-radius: 5px;
    border: 1px solid white;
    background: rgba(255, 255, 255, 0.9);
    width: 300px;
    font-family: Arial, sans-serif;
    -webkit-appearance: none;
    appearance: none;
}

#loadButton {
    padding: 8px 15px;
    border-radius: 5px;
    border: 1px solid white;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: background-color 0.3s ease;
    -webkit-appearance: none;
    appearance: none;
}

#loadButton:hover {
    background: rgba(255, 255, 255, 0.4);
}

.credits-button {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid white;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    text-decoration: none;
    font-size: 14px;
    transition: background-color 0.3s ease;
}

.credits-button:hover {
    background: rgba(255, 255, 255, 0.4);
}

@media screen and (max-width: 768px) {
    .url-input-container {
        flex-direction: column;
        width: 90%;
        top: 10px;
    }

    #urlInput {
        width: 100%;
    }

    .credits-button {
        padding: 6px 12px;
        font-size: 12px;
        top: auto;
        bottom: 10px;
        right: 10px;
    }
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="video-background">
    <iframe 
        width="100%" 
        height="100%" 
        src="https://www.youtube.com/embed/Cq56o0YH3mE?autoplay=1&mute=0&loop=1&playlist=Cq56o0YH3mE&playsinline=1&enablejsapi=1&allow-background-playback=1&controls=0" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; background-playback; web-share" 
        allowfullscreen
        style="position: absolute;">
    </iframe>
</div>

<div class="url-input-container">
    <input type="text" id="urlInput" placeholder="Enter YouTube URL or Video ID">
    <button id="loadButton">Load Video</button>
</div>

<a href="https://www.youtube.com/watch?v=Cq56o0YH3mE" class="credits-button" id="creditsButton">CREDITS</a>

<script>
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

let player;
let playbackMonitor;
let lastPlayState = false;
let currentVideoId = 'Cq56o0YH3mE';

function getYouTubeVideoId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : url;
}

function destroyPlayer() {
    if (player) {
        player.destroy();
        player = null;
    }
    if (playbackMonitor) {
        clearInterval(playbackMonitor);
    }
}

function loadNewVideo(videoId) {
    currentVideoId = videoId;
    destroyPlayer();
    
    const iframe = document.createElement('iframe');
    iframe.width = '100%';
    iframe.height = '100%';
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&loop=1&playlist=${videoId}&playsinline=1&enablejsapi=1&allow-background-playback=1&controls=0`;
    iframe.frameBorder = '0';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; background-playback; web-share';
    iframe.allowFullscreen = true;
    iframe.style.position = 'absolute';

    const container = document.querySelector('.video-background');
    container.innerHTML = '';
    container.appendChild(iframe);

    document.getElementById('creditsButton').href = `https://www.youtube.com/watch?v=${videoId}`;
    
    // Initialize new player
    setTimeout(() => {
        onYouTubeIframeAPIReady();
    }, 1000);
}

document.getElementById('loadButton').addEventListener('click', function() {
    const url = document.getElementById('urlInput').value;
    if (url) {
        const videoId = getYouTubeVideoId(url);
        loadNewVideo(videoId);
    }
});

document.getElementById('urlInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        document.getElementById('loadButton').click();
    }
});

function onYouTubeIframeAPIReady() {
    const iframe = document.querySelector('.video-background iframe');
    player = new YT.Player(iframe, {
        events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
        }
    });
}

function forcePlayback() {
    if (player && typeof player.getPlayerState === 'function') {
        const state = player.getPlayerState();
        if (state !== YT.PlayerState.PLAYING) {
            player.playVideo();
            if (!player.isMuted()) {
                player.unMute();
                player.setVolume(100);
            }
            // Add additional force play attempt
            setTimeout(() => {
                if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                    player.playVideo();
                }
            }, 250);
        }
    }
}

function ensurePlayback() {
    if (player && typeof player.getPlayerState === 'function') {
        const state = player.getPlayerState();
        if (state !== YT.PlayerState.PLAYING) {
            forcePlayback();
        } else {
            backgroundPlaybackAttempts = 0;
            clearInterval(keepAliveInterval);
            keepAliveInterval = setInterval(forcePlayback, 1000); 
        }
    }
}

let keepAliveInterval;
let backgroundPlaybackAttempts = 0;
const MAX_BACKGROUND_ATTEMPTS = 5;

function onPlayerReady(event) {
    player = event.target;
    if (player && typeof player.unMute === 'function') {
        player.unMute();
        player.setVolume(100);
        forcePlayback();
        
        // Start continuous playback monitoring
        playbackMonitor = setInterval(() => {
            if (player && typeof player.getPlayerState === 'function') {
                const isPlaying = player.getPlayerState() === YT.PlayerState.PLAYING;
                if (!isPlaying && lastPlayState) {
                    forcePlayback();
                }
                lastPlayState = isPlaying;
            }
        }, 1000);
    }
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED || 
        event.data === YT.PlayerState.PAUSED || 
        event.data === YT.PlayerState.BUFFERING) {
        forcePlayback();
    }
}

// Enhanced visibility change handling with multiple fallbacks
document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
        // When becoming visible again, force multiple playback attempts
        for (let i = 0; i < 5; i++) {
            setTimeout(forcePlayback, i * 200);
        }
    } else {
        // When hidden, keep trying to play
        for (let i = 0; i < 3; i++) {
            setTimeout(forcePlayback, i * 200);
        }
    }
    ensurePlayback();
});

window.addEventListener('blur', function() {
    for (let i = 0; i < 3; i++) {
        setTimeout(forcePlayback, i * 200);
    }
    ensurePlayback();
});

window.addEventListener('focus', function() {
    backgroundPlaybackAttempts = 0;
    for (let i = 0; i < 5; i++) {
        setTimeout(forcePlayback, i * 200);
    }
    ensurePlayback();
});

// Initialize primary keep-alive
keepAliveInterval = setInterval(() => {
    ensurePlayback();
}, 1000);

// Enhanced recovery system
function recoverPlayback() {
    if (!player || typeof player.getPlayerState !== 'function') {
        loadNewVideo(currentVideoId);
        return;
    }
    
    const state = player.getPlayerState();
    if (state === -1 || state === YT.PlayerState.UNSTARTED) {
        loadNewVideo(currentVideoId);
    } else if (state !== YT.PlayerState.PLAYING) {
        forcePlayback();
    }
}

// Add recovery check every 5 seconds
setInterval(recoverPlayback, 5000);

// Enhance visibility change handling
document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
        recoverPlayback();
    }
    ensurePlayback();
});

// Handle tab visibility API for browsers that support it
if (typeof document.hidden !== "undefined") {
    const handleVisibilityChange = () => {
        if (!document.hidden && player && typeof player.playVideo === 'function') {
            player.playVideo();
        }
    };
    document.addEventListener("visibilitychange", handleVisibilityChange, false);
}

// Keep alive ping to prevent video pause
setInterval(function() {
    if (player && typeof player.playVideo === 'function') {
        player.playVideo();
    }
}, 5000);

window.dispatchEvent(new Event('resize'));

tag.onerror = function() {
    console.error('Failed to load YouTube iframe API');
    setTimeout(() => {
        const newTag = document.createElement('script');
        newTag.src = "https://www.youtube.com/iframe_api";
        firstScriptTag.parentNode.insertBefore(newTag, firstScriptTag);
    }, 2000);
};

window.addEventListener('resize', function() {
    const iframe = document.querySelector('iframe');
    const videoRatio = 16/9;
    const windowRatio = window.innerWidth / window.innerHeight;

    iframe.style.position = 'absolute';
    
    if (windowRatio > videoRatio) {
        const newHeight = window.innerWidth / videoRatio;
        iframe.style.width = window.innerWidth + 'px';
        iframe.style.height = newHeight + 'px';
        iframe.style.top = -((newHeight - window.innerHeight) / 2) + 'px';
        iframe.style.left = '0';
    } else {
        const newWidth = window.innerHeight * videoRatio;
        iframe.style.width = newWidth + 'px';
        iframe.style.height = window.innerHeight + 'px';
        iframe.style.top = '0';
        iframe.style.left = -((newWidth - window.innerWidth) / 2) + 'px';
    }
});

// Initialize the page
window.addEventListener('load', function() {
    if (!player || typeof player.unMute !== 'function') {
        onYouTubeIframeAPIReady();
    }
});
</script>
